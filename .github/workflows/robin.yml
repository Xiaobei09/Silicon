name: Robin

on:
  # 自动审查走 pull_request（不带 secrets 上下文给 fork PR，但无需 GH_PAT 中转）。
  # fork PR 的 secrets 在 pull_request 下不可见（GitHub 安全机制），此时本 job 会
  # 探测到三件套为空并给出告警；维护者评论 /review 走 issue_comment 链路即可补审
  # ——该链路在 base 仓上下文运行，secrets 对 fork PR 同样可见。
  # synchronize 在原始 bootstrap 架构下写了但从未生效：bootstrap 的去重只看
  # 「历史上是否存在过 /review 评论」，PR 第二次推送时必然命中而 skip。删掉 bootstrap
  # 后直连审查已无去重层，synchronize 才第一次真正起作用——推了新提交会重新审查。
  # 草稿 PR 一律跳过（PR 还在写代码时逐次审查纯属烧配额），转正式后由
  # ready_for_review 触发首次审查。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null && (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin')
        ) && (
          github.event.comment.user.login == 'github-actions[bot]' ||
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 秘钥探测：缺 LLM 三件套就不跑审查，并说明补审路径。
      # 典型触发场景 = fork PR 的 pull_request 事件（secrets 不注入）。
      # 注：zen 免费档不需要真实凭据，_KEY 的判定值是字面量 public（见下方 with 注释）。
      - name: Check LLM configuration
        id: llm
        env:
          _BASE: ${{ secrets.LLM_BASE_URL }}
          _KEY: public
          _MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -n "$_BASE" ] && [ -n "$_KEY" ] && [ -n "$_MODEL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LLM 配置（LLM_BASE_URL / LLM_MODEL）不可见，跳过自动审查。若这是 fork PR：pull_request 事件按 GitHub 安全机制不注入 secrets，请维护者评论 /review 走 issue_comment 链路补审（该链路在 base 仓上下文运行，fork PR 同样可审）。若本仓也缺 secret，请在 Settings → Secrets 补齐。"
          fi

      # zen 免费档的实测准入条件（2026-09-27 背靠背对照，间隔 15s 可复现）：
      #   必需 —— stream:true（false 必失败）、tools ≥2 个（0/1 个必失败）、X-Session-ID 头
      #   非必需 —— HTTP-Referer / X-Title / Authorization（无 key 可用）
      # 这里发全套（含非必需项）以防上游日后收紧判定；session id 每次运行随机生成。
      - name: Generate LLM request headers
        if: steps.llm.outputs.ok == 'true'
        id: session
        run: |
          sid="ses_$(openssl rand -hex 6)$(LC_ALL=C tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 14)"
          {
            echo "id=$sid"
            echo 'json={"X-Session-ID":"'"$sid"'","HTTP-Referer":"https://opencode.ai/","X-Title":"opencode","User-Agent":"opencode/1.18.32"}'
          } >> "$GITHUB_OUTPUT"
          echo "Generated session: $sid"

      - name: Robin review
        if: steps.llm.outputs.ok == 'true'
        env:
          ROBIN_DEBUG_HEADERS: 'true'
        uses: Xiaobei09/robin-custom-headers@main
        with:
          github-token: ${{ github.token }}
          # zen 免费档不使用凭据。OpenAI SDK 要求 apiKey 非空，空值会被 robin 兜底成
          # "ollama"（dist L704 `apiKey: apiKey || "ollama"`）并被 zen 拒为
          # "Invalid API key"（实测）。字面量 public 是能被 zen 接受的占位串，非真实密钥，
          # 故直接写死、不进 secrets —— 仓库里不存在任何 LLM 凭据。
          llm-api-key: public
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          custom-headers: ${{ steps.session.outputs.json }}
          config-file: .github/robin.yml
          review-instructions-file: .github/code-reviewer.md
          min-command-permission: triage
          # action 自身第三道 synchronize 闸门，默认 false 会直接跳过并提示走 /review。
          # 官方 v2.7.2 / main 的 action.yml 都有这个 input，不需要 fork 即可开启。
          # 成本控制靠上方 concurrency(cancel-in-progress) + 草稿 PR 跳过。
          review-on-synchronize: true
          # zen 免费档的两条硬性准入（与上方 header 要求同源，实测缺一即 403）：
          #   stream:true —— robin 默认非 router 走 blockingChatCompletion，必须强制走 SSE
          #   tools ≥2    —— robin 从不发 tools，注入两个 tool_choice=none 的占位工具
          # 两者都是 fork 能力，官方 antongulin/robin 无此 input；若切回 space-bunny-free
          # 可直接删掉这两行（该模型不需要）。
          force-stream: true
          compat-tools: true
