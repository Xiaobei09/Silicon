name: Robin

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # 引导：PR 打开/同步/重开/就绪时，用 GH_PAT 代发 /review 触发真实审查
  bootstrap:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-trigger review
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.action }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT 未配置，无法自动触发审查。请在 仓库 Settings → Secrets 配置 GH_PAT（repo 权限 PAT）后重跑，或手动评论 /robin。"
            exit 0
          fi
          # 去重：已存在 bot 的 /review 则跳过，避免对同一 PR 刷屏
          existing=$(gh api "repos/$REPO/issues/$NUMBER/comments" \
            --jq '[.[]|select(.user.login=="github-actions[bot]" and (.body|startswith("/review")))]|length')
          if [ "$existing" -eq 0 ]; then
            gh pr comment "$NUMBER" --repo "$REPO" --body "/review"
            echo "Posted /review via GH_PAT (event=$EVENT)"
          else
            echo "Bootstrap /review already present ($existing), skip auto (use /robin to force)"
          fi

  # 真实审查：仅在 issue_comment 触发，支持维护者与 bot；放行所有权限用户手动触发
  review:
    if: >-
      github.event.issue.pull_request != null && (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/robin')
      ) && (
        github.event.comment.user.login == 'github-actions[bot]' ||
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "NONE"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Robin review
        uses: Xiaobei09/robin@main
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          config-file: .github/robin.yml
          review-instructions-file: .github/code-reviewer.md
          min-command-permission: none
