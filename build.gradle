apply plugin: "java"

import java.util.zip.ZipFile

version = '1.0'

sourceSets.main.java.srcDirs = ["src"]

repositories {
    maven { setUrl("https://www.jitpack.io") }
    maven { setUrl("https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository") }
    mavenCentral()


    ivy {
        url = 'https://github.com/'
        patternLayout { artifact '/[organisation]/[module]/releases/download/[revision]/Mindustry.jar' }
        metadataSources { artifact() }
    }
    ivy {
        url = 'https://github.com/'
        patternLayout { artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar' }
        metadataSources { artifact() }
    }

    //For depending on the absolute newest commit for Mindustry
//    ivy {
//        url = 'https://github.com/'
//        patternLayout { artifact '/[organisation]/[module]/releases/download/master/[revision].jar' }
//        metadataSources { artifact() }
//    }
//     If the version is set to 'latest', downloads the latest Mindustry *release* as a dependency
    ivy {
        url = 'https://github.com/'
        patternLayout { artifact '/[organisation]/[module]/releases/[revision]/download/dependencies.jar' }
        metadataSources { artifact() }
    }
}

java {
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

ext{
    // Mindustry version to depend on.
    // Valid values:
    // - latest: depend on the latest release of mindustry
    // - be: depend on the very latest commit of mindustry
    // - v<number>: depend on a specific commit
    mindustryVersion = "v160.1"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")

    // Parse mod version from mod.hjson for artifact naming
    def hjsonText = file("mod.hjson").text
    def versionLine = hjsonText.readLines().find { it.trim().startsWith("version:") }
    modVersion = versionLine ? versionLine.split(":", 2)[1].trim() : "unknown"
    gameVersion = mindustryVersion
}

dependencies{
    compileOnly mindustryVersion == "be" ? "Anuken:MindustryBuilds:latest" : "Anuken:Mindustry:$mindustryVersion"
//    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
//    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"

    // 音乐播放器的纯 Java 解码器（implementation → 会自动进入 runtimeClasspath，
    // 由下面的 jar 任务打成 mod 单文件 jar）。
    // 目的：mp3/flac 先解成 PCM WAV 再交给 SoLoud——SoLoud 对这两种格式的「流式 seek」
    // 不可靠（flac 归零、部分 mp3 跳错位置），转 WAV 后拖动变为采样级精确；
    // 其余格式（m4a/aac/opus/wma…）仍由可选的 FFmpeg 兜底。
    // 注意：jlayer 与 jflac 的 compile 依赖里带 junit 3.8.2，必须排除，否则会打进 mod jar。
    implementation("com.googlecode.soundlibs:jlayer:1.0.1.4") { exclude group: "junit", module: "junit" }
    implementation("org.jflac:jflac-codec:1.5.2") { exclude group: "junit", module: "junit" }
    // m4a/aac：JAAD（公共领域，纯 Java AAC-LC/HE-AAC + MP4 解封装）
    implementation("de.sfuhrm:jaad:0.8.7")
    // opus：Concentus（BSD-3，纯 Java Opus 解码）+ vorbis-java（Apache-2.0，解 Ogg 容器）
    implementation("io.github.jaredmdobson:concentus:1.0.2")
    implementation("org.gagravarr:vorbis-java-core:0.8")
}

tasks.register('jarAndroid') {
    dependsOn "jar"
    def projectName = project.name

    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find { f -> new File(f, "android.jar").exists() }

        if (!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

        //collect dependencies needed for desugaring
        // Use ProcessBuilder with an argument list instead of string concatenation so that
        // paths containing spaces (e.g. ANDROID_HOME with "Program Files" on Windows) are
        // not split into multiple arguments.
        def classpathDeps = configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList()

        // dex 化改用独立 R8 8.3.37，不再用 build-tools 34.0.0 的 d8（R8 8.2.2-dev）。
        // 背景：旧 d8 开启 desugaring 时会在 classpath 含 java.lang.Record 的情况下
        // 崩溃（NPE），当年为绕开而加 --no-desugaring；结果模组自身的 invoke-dynamic
        // （字符串拼接/lambda/switch 等）未被脱糖，被编译成 $$ExternalSyntheticThrowRTE0
        // 占位方法，安卓真机加载即抛 "Instruction is unrepresentable in DEX V35:
        // invoke-dynamic"。R8 8.3.37 可安全处理 classpath 中的 record，恢复默认脱糖。
        // 需 JDK 17+（CI 与本地均用 JDK 17）。
        def r8Dir = new File(project.projectDir, "gradle/r8")
        def r8File = new File(r8Dir, "r8-8.3.37.jar")
        if (!r8File.exists()) {
            r8Dir.mkdirs()
            def tmp = new File(r8Dir, "r8-8.3.37.jar.part")
            println "Downloading R8 8.3.37 (~16.6MB) for desugaring..."
            new URL("https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar").withInputStream { ins ->
                tmp.withOutputStream { outs -> outs << ins }
            }
            if (!tmp.renameTo(r8File)) throw new GradleException("Failed to move R8 jar into place: ${r8File.path}")
        }
        def javaBin = new File(System.getProperty("java.home"), "bin" + File.separator + (isWindows ? "java.exe" : "java"))
        if (!javaBin.exists()) throw new GradleException("java not found at ${javaBin.path}")

        def cmd = new ArrayList<String>()
        cmd.add(javaBin.path)
        cmd.add("-cp"); cmd.add(r8File.absolutePath)
        cmd.add("com.android.tools.r8.D8")
        classpathDeps.each { dep -> cmd.add("--classpath"); cmd.add(dep.path) }
        cmd.add("--lib"); cmd.add(new File(platformRoot, "android.jar").path)
        cmd.add("--min-api"); cmd.add("21")
        // 默认脱糖开启（不再 --no-desugaring），确保 invoke-dynamic 全部转成 dex 表示
        cmd.add("--output"); cmd.add(projectName + "Android.jar")
        cmd.add(projectName + "Desktop.jar")

        def process = new ProcessBuilder(cmd)
                .directory(new File(project.projectDir, "build/libs"))
                .redirectErrorStream(true)
                .start()
        process.consumeProcessOutput(System.out, System.err)
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("d8 dexing failed with exit code ${process.exitValue()}")
        }

        // 产物自检：classes.dex 不得残留 $$ExternalSyntheticThrowRTE* 占位方法，
        // 否则模块必在安卓真机加载时抛 "Instruction is unrepresentable in DEX"。
        def androidJar = new File(project.projectDir, "build/libs/${projectName}Android.jar")
        def zf = new ZipFile(androidJar)
        try {
            def entry = zf.getEntry("classes.dex")
            if (entry == null) throw new GradleException("classes.dex missing in ${androidJar.path}")
            def dex = new byte[(int) entry.size]
            def ins = zf.getInputStream(entry)
            try {
                int off = 0
                while (off < dex.length) {
                    int r = ins.read(dex, off, dex.length - off)
                    if (r < 0) break
                    off += r
                }
            } finally { ins.close() }
            def marker = "ExternalSyntheticThrowRTE".getBytes("ISO-8859-1")
            boolean found = false
            int i = 0
            while (!found && i <= dex.length - marker.length) {
                boolean match = true
                for (int j = 0; j < marker.length; j++) {
                    if (dex[i + j] != marker[j]) { match = false; break }
                }
                if (match) found = true
                i++
            }
            if (found) {
                throw new GradleException("classes.dex contains ExternalSyntheticThrowRTE placeholders (" +
                        "un-desugared invoke-dynamic). Desugaring must stay enabled — do not re-add --no-desugaring.")
            }
        } finally { zf.close() }
    }
}

jar{
    archiveFileName = "${project.name}Desktop.jar"

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.hjson"
        include "pinyin.txt"
    }

    from("assets/"){
        include "**"
    }

    // 内置解码器（jlayer/jflac）打包配套：
    // - 排除签名文件，否则装进 mods 会因无效签名加载失败
    // - 排除依赖 javax.sound / java.applet 的类（桌面之外不存在，且我们只用其 PCM 解码核心）
    // - 排除 SPI 注册（保留但没有 SPI 实现类 → NoClassDefFoundError），
    //   以及 jlayer 的资源加载在 Android 上的备用 hook 无关的示例/播放器类
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/INDEX.LIST"
    exclude "META-INF/services/**"
    exclude "javazoom/jl/player/**", "javazoom/jl/converter/**", "javazoom/jl/decoder/DecoderTest*"
    exclude "org/jflac/sound/**"
    // jaad 中依赖 javax.sound / java.awt 的类（SPI 播放器、封面/视频盒）：我们只用其 AAC 解码核心
    exclude "net/sourceforge/jaad/spi/**"
    exclude "net/sourceforge/jaad/Play.class", "net/sourceforge/jaad/Radio.class"
    exclude "net/sourceforge/jaad/mp4/api/Artwork.class"
    exclude "net/sourceforge/jaad/mp4/boxes/impl/VideoMediaHeaderBox.class"
    exclude "net/sourceforge/jaad/mp4/boxes/impl/ArtworkBox*"
}

tasks.register('deploy', Jar) {
    def projectName = project.name
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${projectName}-${modVersion}-${gameVersion}.jar"
    destinationDirectory = file("build/libs")

    from { [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }

    doLast {
        delete {
            delete "build/libs/${projectName}Android.jar"
        }
    }
}